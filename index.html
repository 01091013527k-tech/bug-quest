<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>도담이와 곤충 탐험대</title>
<meta name="theme-color" content="#9FDCFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="곤충 탐험대">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#3B2F5C;--ink2:#756A99;--green:#5CC96B;--green-d:#3FA34F;--orange:#FF9F43;--orange-d:#E07B1D;--purple:#9C7CF4;--purple-d:#7A5AD6;--pink:#FF7EA8;--pink-d:#E05A86;--blue:#5BC0EB;--blue-d:#3A9AC4;--yellow:#FFD54F;--yellow-d:#E8B520;--red:#FF6B6B;--red-d:#D94848;--r:28px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Jua',system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(#9FDCFF 0%,#D4F1FF 55%,#E9FFF0 100%);-webkit-user-select:none;user-select:none;touch-action:manipulation;font-size:20px}
button{font-family:inherit;color:inherit}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg .cloud{position:absolute;opacity:.95;animation:drift linear infinite}
#bg .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh}
#bg .fly{position:absolute;width:46px;height:46px;animation:flyaround 18s ease-in-out infinite}
#app{position:relative;z-index:1;height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden}
.screen{min-height:100%;padding:14px 20px 18px;display:flex;flex-direction:column;gap:14px;animation:fadeIn .35s ease}
.center{align-items:center;justify-content:center}
.panel{background:rgba(255,255,255,.94);border-radius:var(--r);box-shadow:0 8px 0 rgba(59,47,92,.10),0 14px 34px rgba(59,47,92,.12);padding:24px}
.btn{border:0;border-radius:22px;padding:12px 22px;font-size:22px;color:#fff;background:var(--b,var(--green));box-shadow:0 6px 0 var(--bd,var(--green-d));cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.2}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--bd,var(--green-d))}
.btn.big{font-size:28px;padding:16px 30px;border-radius:26px}
.btn.sm{font-size:18px;padding:8px 14px;border-radius:16px;box-shadow:0 4px 0 var(--bd)}
.btn.green{--b:var(--green);--bd:var(--green-d)}.btn.orange{--b:var(--orange);--bd:var(--orange-d)}.btn.purple{--b:var(--purple);--bd:var(--purple-d)}.btn.pink{--b:var(--pink);--bd:var(--pink-d)}.btn.blue{--b:var(--blue);--bd:var(--blue-d)}.btn.gray{--b:#B9B4C9;--bd:#948DAA}.btn.red{--b:var(--red);--bd:var(--red-d)}.btn.yellow{--b:var(--yellow);--bd:var(--yellow-d);color:var(--ink)}
.btn:disabled{filter:grayscale(.6);opacity:.55;cursor:default}
input.inp{font-family:inherit;font-size:22px;padding:12px 16px;border-radius:18px;border:3px solid #E3DDF5;outline:none;width:100%;color:var(--ink);background:#FBFAFF;-webkit-user-select:text;user-select:text}
input.inp:focus,textarea.inp:focus{border-color:var(--purple)}
textarea.inp{font-family:monospace;font-size:13px;padding:10px;border-radius:14px;border:3px solid #E3DDF5;width:100%;height:90px;resize:vertical;-webkit-user-select:text;user-select:text;color:var(--ink);background:#FBFAFF}
.pmsg{display:block;margin-top:6px;font-size:21px;color:var(--pink-d)}
label.lb{display:flex;flex-direction:column;gap:6px;font-size:19px;color:var(--ink2)}
.err{color:var(--red-d);min-height:24px;font-size:19px;text-align:center}
.icon-btn{border:0;background:rgba(255,255,255,.9);border-radius:20px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;font-size:26px;line-height:1.1;box-shadow:0 4px 0 rgba(59,47,92,.12);cursor:pointer;min-width:64px}
.icon-btn small{font-size:14px;color:var(--ink2)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,47,92,.12)}
.bubble{background:#fff;border-radius:24px;padding:14px 20px;font-size:24px;position:relative;box-shadow:0 5px 0 rgba(59,47,92,.08);line-height:1.35}
.bubble.left::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:16px solid #fff;border-left:0}
.char svg,.mini svg{width:100%;height:auto;display:block}
.float{animation:float 3s ease-in-out infinite}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes flyaround{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(18vw,-6vh) rotate(8deg)}50%{transform:translate(36vw,4vh) rotate(-6deg)}75%{transform:translate(14vw,10vh) rotate(6deg)}100%{transform:translate(0,0) rotate(-8deg)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes bounceIn{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
.gicon{display:inline-block;width:42px;height:42px;vertical-align:middle}.gicon svg{width:100%;height:100%}
.cbug.shake{animation:shake .45s}
.pop{animation:pop .45s ease}

/* loading */
.loading .crawl{width:120px;animation:bob 1s ease-in-out infinite}
.loading p{font-size:26px;color:var(--ink2)}

/* login / setup */
.logo{text-align:center;font-size:30px;color:#fff;text-shadow:0 3px 0 var(--purple-d),0 0 2px var(--purple-d);line-height:1.1}
.logo b{display:block;font-size:56px;font-weight:400;color:#FFE066;text-shadow:0 4px 0 var(--orange-d),0 0 3px var(--orange-d)}
.login-row{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:960px}
.login-row .hero{width:170px;flex:none}
.login-row .ppu{width:150px;flex:none}
.loginbox{width:min(440px,100%);display:flex;flex-direction:column;gap:12px}
.loginbox .bubble{background:#F3EEFF;box-shadow:none;text-align:center;font-size:22px}
.field{display:flex;align-items:center;gap:10px}
.field span{width:120px;font-size:21px;flex:none}
.chk{display:flex;align-items:center;gap:8px;font-size:18px;color:var(--ink2)}
.chk input{width:22px;height:22px;accent-color:var(--purple)}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:16px;cursor:pointer;margin-top:4px}
.setup{width:min(520px,100%);display:flex;flex-direction:column;gap:12px}
.setup h1{margin:0;text-align:center;font-weight:400;font-size:34px}
.setup .sub{margin:0;text-align:center;color:var(--ink2)}
.setup .chars{display:flex;justify-content:center;gap:8px}
.setup .chars>div{width:96px}
@media (max-width:760px){.login-row .hero,.login-row .ppu{display:none}}

/* home */
.topbar{display:flex;align-items:center;gap:12px}
.me{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);border-radius:24px;padding:6px 16px 6px 6px;box-shadow:0 4px 0 rgba(59,47,92,.1)}
.avatar{width:58px;height:58px;border-radius:50%;background:#FFF4D6;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
.avatar svg{width:74px;margin-top:-2px}
.me .name{font-size:22px}
.me .lv{font-size:15px;color:var(--ink2)}
.lvbar{height:9px;width:130px;background:#EEE9FA;border-radius:9px;overflow:hidden;margin-top:3px}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#FFD54F,#FF9F43);border-radius:9px}
.stats{display:flex;gap:8px}
.pill{background:rgba(255,255,255,.9);border-radius:20px;padding:8px 14px;font-size:22px;box-shadow:0 4px 0 rgba(59,47,92,.1)}
.tb-actions{margin-left:auto;display:flex;gap:8px}
.hero-area{display:flex;align-items:center;gap:22px;padding:0 6px}
.hero-area .ppu{width:120px;flex:none}
.hero-area .heroc{width:104px;flex:none}
.hero-area .bubble{flex:1;font-size:27px}
.trail{position:relative;height:30px;background:rgba(255,255,255,.75);border-radius:16px;margin:0 6px;box-shadow:inset 0 2px 0 rgba(0,0,0,.05)}
.trail .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#B9F3A8,#5CC96B);border-radius:16px;transition:width .6s}
.trail .walker{position:absolute;top:-14px;width:52px;margin-left:-26px;transition:left .6s}
.trail .goal{position:absolute;right:-6px;top:-12px;font-size:34px}
.trail-lbl{font-size:21px;padding:0 10px;margin-bottom:-4px}.trail-lbl b{font-weight:400;color:var(--green-d)}
.quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,250px));justify-content:center;gap:16px;padding:6px}
.qcard{position:relative;border:0;background:#fff;border-radius:30px;padding:16px 10px 14px;min-height:196px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 var(--cs),0 12px 24px rgba(59,47,92,.12);border:4px solid var(--c);cursor:pointer;transition:transform .1s}
.qcard:active{transform:translateY(5px);box-shadow:0 3px 0 var(--cs)}
.qcard .qnum{position:absolute;left:12px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.qcard .qicon{width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.qcard .qname{font-size:22px;line-height:1.15}
.qcard .qsub{font-size:17px;color:var(--ink2)}
.qcard.done{opacity:.92}
.qcard.done .qicon{filter:saturate(.5)}
.stamp{position:absolute;right:4px;top:4px;width:66px;height:66px;font-size:13px!important;border-radius:50%;border:4px solid #FF5A5F;color:#FF5A5F;font-size:15px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;transform:rotate(-16deg);background:rgba(255,255,255,.85);animation:pop .4s}
.bottom-nav{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 6px}
.bottom-nav button{border:0;background:#fff;border-radius:24px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;font-size:19px;box-shadow:0 6px 0 rgba(59,47,92,.13);cursor:pointer;gap:2px}
.bottom-nav button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(59,47,92,.13)}
.bottom-nav .ni{font-size:38px;line-height:1}
.bottom-nav b{font-weight:400;font-size:16px;color:var(--ink2)}
.sync{font-size:14px;color:var(--ink2);text-align:center}

/* quest */
.screen.quest{height:100%;min-height:0}
.qbar{display:flex;align-items:center;gap:12px}
.qtitle{font-size:28px;background:var(--c);color:#fff;border-radius:22px;padding:8px 20px;box-shadow:0 5px 0 var(--cs)}
.tag{font-size:16px;background:#fff;color:var(--ink);border-radius:10px;padding:2px 8px;vertical-align:middle}
.rounds{margin-left:auto;display:flex;gap:8px}
.rounds i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.8);border:3px solid var(--c)}
.rounds i.on{background:var(--c)}
.guide{display:flex;align-items:center;gap:14px}
.guide .mini{width:74px;flex:none}
.guide .bubble{flex:1;font-size:24px}
.spk{border:0;background:var(--yellow);border-radius:50%;width:58px;height:58px;font-size:28px;box-shadow:0 5px 0 var(--yellow-d);cursor:pointer;flex:none}
.spk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-d)}
.qbody{flex:1;display:flex;min-height:0}
.trace-wrap{flex:1;display:grid;grid-template-columns:190px 1fr 170px;gap:16px;min-height:0}
.letter-card{background:#fff;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;box-shadow:0 6px 0 rgba(59,47,92,.1)}
.lc-ch{font-size:92px;line-height:1;color:var(--c)}
.lc-emoji{font-size:64px;line-height:1}
.lc-word{font-size:26px}
.canvas-box{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.sq{position:relative;background:#fff;border-radius:30px;box-shadow:0 8px 0 rgba(59,47,92,.12),0 10px 30px rgba(59,47,92,.1);overflow:hidden}
.sq canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;flex-direction:column;gap:12px;align-items:stretch;justify-content:center}
.crayons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.crayon{height:52px;border-radius:16px;border:4px solid #fff;background:var(--cc);box-shadow:0 4px 0 rgba(0,0,0,.15);cursor:pointer}
.crayon.on{outline:4px solid var(--ink);transform:scale(1.05)}
.meter{position:relative;height:26px;background:#fff;border-radius:14px;overflow:visible;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFE58A,#FFB443);border-radius:14px;transition:width .3s}
.meter .mstar{position:absolute;right:-8px;top:-12px;font-size:32px}
.sum{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.sum-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;align-content:start;background:#fff;border-radius:28px;padding:16px;overflow:auto;box-shadow:0 6px 0 rgba(59,47,92,.1)}
.sum-i{display:flex;flex-direction:column;align-items:center;gap:2px;animation:pop .4s}
.sum-i img,.sum-ph{width:100%;aspect-ratio:1;border-radius:16px;border:3px solid #F1ECFF;display:block}
.sum-ph{display:flex;align-items:center;justify-content:center;font-size:50px;color:#D9CCFF}
.sum-i span{font-size:16px;color:var(--ink2)}
.btn.ready{box-shadow:0 6px 0 var(--bd),0 0 0 7px rgba(92,201,107,.35)}
@media (max-aspect-ratio:1/1){
 .trace-wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
 .letter-card{flex-direction:row;padding:10px 16px}
 .lc-ch{font-size:64px}.lc-emoji{font-size:48px}
 .tools{flex-direction:row;flex-wrap:wrap}
 .crayons{grid-template-columns:repeat(5,52px)}
 .tools .meter{flex:1;min-width:160px}
}
/* choices */
.listen,.eng,.count{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:0}
.big-speaker{border:0;background:var(--c);color:#fff;border-radius:50%;width:170px;height:170px;font-size:76px;box-shadow:0 10px 0 var(--cs),0 14px 30px rgba(0,0,0,.12);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.big-speaker small{font-size:20px;margin-top:6px}
.big-speaker:active{transform:translateY(6px);box-shadow:0 4px 0 var(--cs)}
.big-speaker.sm{width:96px;height:96px;font-size:44px;flex:none}
.choices{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.choice{border:0;background:#fff;border-radius:32px;min-width:170px;height:170px;font-size:92px;box-shadow:0 9px 0 rgba(59,47,92,.15);cursor:pointer;padding:0 18px;transition:transform .1s;color:var(--ink)}
.choice:active{transform:translateY(5px)}
.choice.right{background:#C9F7C2;box-shadow:0 9px 0 var(--green-d);animation:bounceIn .5s}
.choice.wrong{background:#FFE0E0;opacity:.6}
.choice.pic{font-size:72px;min-width:230px;display:flex;align-items:center;justify-content:center;gap:6px}
.choice.pic .h{font-size:30px}
.choices.num .choice{font-size:84px;min-width:150px;height:150px}
.sentence-card{display:flex;align-items:center;gap:20px;background:#fff;border-radius:30px;padding:16px 28px 16px 16px;box-shadow:0 7px 0 rgba(59,47,92,.1)}
.sentence{font-size:44px;font-family:'Jua',sans-serif;letter-spacing:.5px}
.field-area{position:relative;width:min(900px,100%);flex:1;min-height:220px;max-height:420px;background:linear-gradient(#DFF7D2,#BDEBA6);border-radius:32px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.05),0 6px 0 rgba(59,47,92,.08)}
.cbug{position:absolute;width:92px;height:92px;border:0;background:none;padding:0;cursor:pointer;animation:wiggle 2.6s ease-in-out infinite}
.cbug svg{width:100%;height:100%}
.cbug .n{position:absolute;right:-4px;top:-6px;width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;animation:pop .3s;box-shadow:0 3px 0 var(--orange-d)}
/* draw */
.draw-wrap{flex:1;display:grid;grid-template-columns:180px 1fr 200px;gap:16px;min-height:0}
.excard{background:#fff;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;box-shadow:0 6px 0 rgba(59,47,92,.1)}
.excard .ex-e{font-size:110px;line-height:1.1}.excard .ex-s{width:140px}.excard .pn{font-size:26px}
.ex-s svg{width:100%;height:auto;display:block}
.pick{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.pick-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,210px));gap:18px}
.pitem{border:0;background:#fff;border-radius:30px;padding:18px 10px;box-shadow:0 8px 0 var(--cs);border:4px solid var(--c);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.pitem:active{transform:translateY(5px);box-shadow:0 3px 0 var(--cs)}
.pitem .ex-e{font-size:96px;line-height:1.1}.pitem .ex-s{width:120px}.pitem .pn{font-size:24px}
.draw-wrap .tools .crayons{grid-template-columns:repeat(2,1fr)}
.sizes{display:flex;gap:8px;justify-content:space-between}
.size{flex:1;height:52px;border-radius:16px;border:0;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);cursor:pointer;display:flex;align-items:center;justify-content:center}
.size i{display:block;border-radius:50%;background:var(--ink)}
.size.on{outline:4px solid var(--purple)}
@media (max-aspect-ratio:1/1){.pick-grid{grid-template-columns:repeat(2,minmax(150px,230px))}.excard{flex-direction:row;padding:8px 14px}.excard .ex-e{font-size:60px}.excard .ex-s{width:76px}.draw-wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}.draw-wrap .tools .crayons{grid-template-columns:repeat(5,1fr)}}

/* sub screens */
.subbar{display:flex;align-items:center;gap:12px}
.subbar h2{margin:0;font-weight:400;font-size:32px;background:#fff;border-radius:22px;padding:8px 22px;box-shadow:0 5px 0 rgba(59,47,92,.1)}
.gift-banner{display:flex;align-items:center;gap:18px;background:#fff;border-radius:28px;padding:14px 22px;box-shadow:0 6px 0 rgba(59,47,92,.1)}
.gift-banner .gift-box{font-size:66px;line-height:1}
.gift-banner.ready{background:linear-gradient(90deg,#FFF3C4,#FFE0EC)}
.gift-banner.ready .gift-box{animation:wiggle .8s ease-in-out infinite}
.gb-t{font-size:24px}.gb-gift{font-size:30px;color:var(--pink-d)}.gb-s{font-size:19px;color:var(--ink2)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;background:rgba(255,255,255,.7);border-radius:30px;padding:18px}
.slot{aspect-ratio:1;border-radius:26px;border:4px dashed #CFC6EA;display:flex;align-items:center;justify-content:center;font-size:40px;color:#CFC6EA;background:rgba(255,255,255,.6);position:relative}
.slot.full{border:4px solid #fff;background:#FFF8E1;box-shadow:0 5px 0 rgba(59,47,92,.12);animation:pop .4s}
.slot.full svg{width:84%;height:84%}.slot.full .sart svg{width:100%;height:100%}
.slot .no{position:absolute;left:8px;top:4px;font-size:15px;color:var(--ink2)}
h3.sec{margin:6px 0 0;font-weight:400;font-size:26px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.dexi{background:#fff;border-radius:22px;padding:8px;text-align:center;font-size:16px;box-shadow:0 4px 0 rgba(59,47,92,.1)}
.dexi svg{width:76px;height:76px;display:block;margin:0 auto}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{background:#fff;border-radius:26px;padding:14px 10px;text-align:center;box-shadow:0 6px 0 rgba(59,47,92,.1)}
.badge .bi{width:86px;height:86px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6C8,#FFD54F 60%,#F0B323);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 5px 0 #D79A12}
.badge.lock .bi{background:#EEEAF6;box-shadow:0 5px 0 #D6D0E6;filter:grayscale(1);opacity:.5}
.badge .bn{font-size:19px}.badge .bd{font-size:14px;color:var(--ink2)}
.map{position:relative;background:linear-gradient(#F4FBE9,#E3F5D3);border-radius:30px;box-shadow:inset 0 0 0 6px #fff,0 6px 0 rgba(59,47,92,.1);margin:4px 0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .road{fill:none;stroke:#E2C9A0;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:2 22}
.map .road.done{stroke:#FFB443;stroke-dasharray:none;stroke-width:10}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:110px}
.node.ms .nb{width:78px;height:78px}
.node .nb{width:62px;height:62px;border-radius:50%;background:#fff;border:4px dashed #CFC6EA;display:flex;align-items:center;justify-content:center;font-size:26px;color:#C9BEE8}
.node.got .nb{border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#FFF6C8,#FFD54F 60%,#F0B323);box-shadow:0 5px 0 #D79A12;color:var(--ink)}
.node.next .nb{border-color:var(--orange);color:var(--orange);animation:bounceIn 1.4s ease infinite}
.node.start .nb{border:4px solid #fff;background:#BDE7FF;color:var(--ink);box-shadow:0 5px 0 #8CC8EC}
.node.goal .nb{width:92px;height:92px;font-size:50px;border:5px solid #fff;background:#FFE0EC;box-shadow:0 6px 0 var(--pink-d);color:var(--ink)}
.node.goal.reached .nb{animation:wiggle .8s ease-in-out infinite;background:#FFF3C4}
.node .nl{font-size:14px;text-align:center;line-height:1.1;margin-top:4px;background:rgba(255,255,255,.85);border-radius:8px;padding:2px 6px;max-width:110px}
.node.goal .nl{font-size:16px;color:var(--pink-d)}
.me-pin{position:absolute;top:-56px;width:50px;z-index:2;animation:bob 1.6s ease-in-out infinite}
.me-pin svg{width:100%;height:auto;display:block}
.emo{font-size:70px;line-height:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.cbug .emo{font-size:64px}.gicon .emo{font-size:34px}
.quiz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:0}
.bigart{width:220px;height:220px;background:#fff;border-radius:40px;box-shadow:0 8px 0 rgba(59,47,92,.12);display:flex;align-items:center;justify-content:center;padding:16px}
.bigart svg{width:100%;height:100%}.bigart .emo{font-size:150px}
.choice.name{font-size:40px;min-width:200px;height:110px}

.choice.art svg{width:100%;height:100%}.choice.art .emo{font-size:100px}
.spot{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.sp-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.sp-panel{position:relative;border-radius:26px;box-shadow:0 6px 0 rgba(59,47,92,.12);border:5px solid #fff;overflow:hidden;touch-action:manipulation;cursor:pointer}
.sp-i{position:absolute;transform:translate(-50%,-50%);font-size:clamp(34px,5.4vw,60px);line-height:1;pointer-events:none}
.sp-marks{position:absolute;inset:0;pointer-events:none}
.sp-ok{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:6px solid #FF4D6D;border-radius:50%;animation:pop .35s}
.sp-no{position:absolute;transform:translate(-50%,-50%);color:#9A90B5;font-size:28px}
.sp-hint{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:radial-gradient(circle,rgba(255,235,59,.75),rgba(255,235,59,0) 70%);animation:bounceIn .6s ease 3}
.sp-bar{display:flex;align-items:center;justify-content:center;gap:16px}
.sp-count{display:flex;gap:10px}.sp-count i{width:34px;height:34px;border-radius:50%;border:4px solid var(--c);background:#fff}.sp-count i.on{background:var(--c)}
.puz{flex:1;display:flex;align-items:center;justify-content:center;gap:20px;min-height:0}
.pz-prev{width:190px;background:#fff;border-radius:24px;padding:10px;text-align:center;font-size:18px;color:var(--ink2);box-shadow:0 6px 0 rgba(59,47,92,.1)}
.pz-prev img{width:100%;border-radius:16px;display:block}
.pz-box{display:grid;gap:4px;background:#fff;padding:6px;border-radius:24px;box-shadow:0 8px 0 rgba(59,47,92,.12)}
.pz-box.solved{gap:0;box-shadow:0 0 0 8px #FFD54F,0 8px 0 rgba(59,47,92,.12)}
.pz-t{border:0;border-radius:10px;cursor:pointer;background-repeat:no-repeat;padding:0;transition:transform .12s}
.pz-t.sel{outline:6px solid var(--orange);transform:scale(.94)}
.pz-box.solved .pz-t{border-radius:0}

.week{display:flex;align-items:center;gap:8px;padding:0 10px;flex-wrap:wrap}
.wk-l{font-size:18px;color:var(--ink2);margin-right:4px}

.wk.full .wk-c{border:3px solid #fff;background:#FFF3C4;box-shadow:0 3px 0 #E8B520}.wk.full .wk-c svg{width:38px;height:38px}
.wk.half .wk-c{border-style:solid;border-color:#fff}
.wk.today span{color:var(--pink-d);font-weight:700}.wk.today .wk-c{border-color:var(--pink)}

.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

.gitem{border:0;background:#fff;border-radius:22px;padding:8px;box-shadow:0 6px 0 rgba(59,47,92,.1);cursor:pointer}

.gitem div{font-size:16px;color:var(--ink2);padding-top:4px}
.empty{text-align:center;color:var(--ink2);font-size:24px;padding:40px 10px}
.empty .char{width:130px;margin:0 auto 10px}

/* parent */
.ptabs{display:flex;gap:10px;flex-wrap:wrap}
.ptab{border:0;border-radius:18px;padding:10px 20px;font-size:21px;background:rgba(255,255,255,.75);cursor:pointer}
.ptab.on{background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-d)}
.pcard{background:#fff;border-radius:24px;padding:18px 20px;box-shadow:0 5px 0 rgba(59,47,92,.08);display:flex;flex-direction:column;gap:12px}

.prow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prow .pl{min-width:150px;color:var(--ink2);font-size:19px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:3px solid #E3DDF5;background:#fff;border-radius:16px;padding:7px 14px;font-size:19px;cursor:pointer}
.chip.on{border-color:var(--purple);background:#F1ECFF}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:46px;height:46px;border-radius:50%;border:0;background:var(--purple);color:#fff;font-size:28px;box-shadow:0 4px 0 var(--purple-d);cursor:pointer}
.stepper span{font-size:30px;min-width:40px;text-align:center}
.hint{font-size:16px;color:var(--ink2)}
table.rec{width:100%;border-collapse:collapse;font-size:18px}
table.rec td,table.rec th{padding:8px 6px;border-bottom:2px solid #F0ECF8;text-align:left;font-weight:400}
table.rec th{color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv div{background:#F7F4FF;border-radius:16px;padding:10px 12px;font-size:16px;color:var(--ink2)}
.kv b{display:block;font-weight:400;font-size:26px;color:var(--ink)}

/* overlay */
#overlay{position:fixed;inset:0;z-index:50;display:none}
#overlay.on{display:block}
.ov-bg{position:absolute;inset:0;background:rgba(59,47,92,.45);display:flex;align-items:center;justify-content:center;padding:20px}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.modal{position:relative;background:#fff;border-radius:34px;padding:26px 28px;max-width:560px;width:100%;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.12);animation:pop .45s ease;max-height:92vh;overflow:auto}
.modal h2{margin:4px 0 10px;font-weight:400;font-size:40px;color:var(--pink-d)}
.modal .mchar{width:130px;margin:-6px auto 0}
.modal .rw{font-size:24px;margin:8px 0;display:flex;align-items:center;justify-content:center;gap:10px}
.modal .newbug{width:140px;margin:0 auto;animation:wiggle 1.4s ease-in-out infinite}
.modal .btns{display:flex;gap:12px;justify-content:center;margin-top:16px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:12px 0 16px}
.pin-dots i{width:24px;height:24px;border-radius:50%;border:3px solid var(--purple)}
.pin-dots i.on{background:var(--purple)}
.keypad{display:grid;grid-template-columns:repeat(3,84px);gap:12px;justify-content:center}
.keypad button{height:72px;border:0;border-radius:22px;background:#F3EEFF;font-size:32px;box-shadow:0 5px 0 #D9CFF5;cursor:pointer}
.keypad button:active{transform:translateY(3px);box-shadow:0 2px 0 #D9CFF5}
.bigimg{width:100%;border-radius:20px;display:block}
#testbadge{position:fixed;left:8px;bottom:6px;z-index:40;border:0;border-radius:14px;background:#FFE066;color:var(--ink);font-size:14px;padding:4px 12px;box-shadow:0 3px 0 #E8B520;opacity:.9;cursor:pointer}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(200px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:20px;font-size:20px;z-index:60;transition:transform .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:700px){
 .quests{grid-template-columns:repeat(2,1fr)}
 .bottom-nav .ni{font-size:30px}
 .hero-area .heroc{display:none}

 .lvbar{width:90px}
 .choice{min-width:120px;height:120px;font-size:64px}
 .choice.pic{min-width:160px;font-size:52px}
 .sentence{font-size:30px}
 .big-speaker{width:130px;height:130px;font-size:56px}
}

function makeQuest(t,off){const s=S();
 if(t==='hangul'||t==='vowel'||t==='abc'||t==='abcl'){return {type:t,set:t==='hangul'?'consonants':'all',pos:0,done:false};}
 if(t==='num'){const idx=s.progress[t]+(off[t]||0);off[t]=(off[t]||0)+1;return {type:t,idx,done:false};}
 if(t==='listen'){const koPool=Math.min(HANGUL.length,Math.max(6,s.progress.hangul+4)),enPool=Math.min(ABC.length,Math.max(6,s.progress.abc+4));const rounds=[];const used={ko:[],en:[]};
  for(let r=0;r<3;r++){const mode=(r===1)?'en':'ko';const pool=mode==='ko'?koPool:enPool;let a;do{a=rint(pool);}while(used[mode].includes(a)&&used[mode].length<pool);used[mode].push(a);const ch=[a];while(ch.length<3){const x=rint(pool);if(!ch.includes(x))ch.push(x);}rounds.push({mode,a,ch:shuffle(ch)});}

  const others=(c,n)=>{const o=[c];while(o.length<n){const x=rint(all.length);if(!o.includes(x))o.push(x);}return shuffle(o);};
  kinds.forEach((k,r)=>{const c=pick();
   if(k==='count'){const n=1+rint(r<3?maxN:Math.min(maxN,6));const oth=[];let left=12-n;const kk=rint(3);const pool=shuffle(all.filter(x=>x!==c));for(let j=0;j<kk&&left>0;j++){const m=Math.min(left,1+rint(4));oth.push({c:pool[j],k:m});left-=m;}const ch=[n];while(ch.length<3){const x=1+rint(Math.max(maxN,5));if(!ch.includes(x))ch.push(x);}rounds.push({k,c,n,others:oth,ch:shuffle(ch)});}

function genQuests(){const s=S();let en=TYPE_ORDER.filter(t=>s.settings.subjects[t]);if(!en.length)en=['hangul'];const n=Math.max(1,Math.min(7,s.settings.questCount|0||3));const start=dayNum(todayKey())%en.length;const off={};const out=[];for(let k=0;k<n;k++)out.push(makeQuest(en[(start+k)%en.length],off));out.sort((a,b)=>(a.type==='draw')-(b.type==='draw'));return out;}

function makePad(cv,opt){opt=opt||{};const ctx=cv.getContext('2d');const pad={color:CRAYONS[0],size:10,erase:false,strokes:0,ctx};let drawing=false,last=null;
 const pos=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
 function style(){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=pad.size;if(pad.erase){if(opt.bg){ctx.globalCompositeOperation='source-over';ctx.strokeStyle=ctx.fillStyle=opt.bg;}else{ctx.globalCompositeOperation='destination-out';ctx.strokeStyle=ctx.fillStyle='#000';}}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=ctx.fillStyle=pad.color;}}
 const dot=p=>{style();ctx.beginPath();ctx.arc(p.x,p.y,pad.size/2,0,Math.PI*2);ctx.fill();};
 const line=(a,b)=>{style();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();opt.onStart&&opt.onStart();try{cv.setPointerCapture(e.pointerId);}catch(_){}drawing=true;last=pos(e);dot(last);});
 cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(ev=>{const p=pos(ev);line(last,p);last=p;});});
 const end=()=>{if(!drawing)return;drawing=false;pad.strokes++;opt.onEnd&&opt.onEnd();};
 cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 pad.clear=()=>{ctx.globalCompositeOperation='source-over';if(opt.bg){ctx.fillStyle=opt.bg;ctx.fillRect(0,0,cv.width,cv.height);}else ctx.clearRect(0,0,cv.width,cv.height);pad.strokes=0;};
 pad.clear();return pad;}

function renderBadges(){const s=S();const N=s.settings.mapLen||40;const ent=mapEntries();const steps=Math.min(ent.length,N);const done=steps>=N;const total=N+2;const cols=8;const rows=Math.ceil(total/cols);
 const pos=i=>{const r=Math.floor(i/cols);let c=i%cols;if(r%2===1)c=cols-1-c;return {x:7+c*(86/(cols-1)),y:(r+0.5)*(100/rows)};};
 const pts=Array.from({length:total},(_,i)=>pos(i));
 const nodes=pts.map((p,i)=>{let cls='node',inner='',lab='';
  if(i===0){cls+=' start';inner='🏠';lab='출발';}
  else if(i===total-1){cls+=' goal'+(done?' reached':'');inner='🎁';lab=esc(s.settings.mapGift||'보물 선물');}
  else{const ms=i%10===0;const e=ent[i-1];if(i<=steps&&e){cls+=' got'+(ms?' ms':'');inner=e.icon;lab=esc(e.name);}else{cls+=(i===steps+1?' next':'')+(ms?' ms':'');inner=ms?'🎀':String(i);lab=ms?`${i}칸`:'';}}
  const here=(done?i===total-1:i===steps)?`<div class="me-pin">${HERO_SVG}</div>`:'';
  return `<div class="${cls}" style="left:${p.x}%;top:${p.y}%">${here}<div class="nb">${inner}</div>${lab?`<div class="nl">${lab}</div>`:''}</div>`;}).join('');
 const path='M'+pts.map(p=>`${p.x} ${p.y}`).join(' L');const dp=steps?'M'+pts.slice(0,steps+1+(done?1:0)).map(p=>`${p.x} ${p.y}`).join(' L'):'';
 return `<div class="screen">${subbar('🗺️ 보물 지도')}
 <div class="gift-banner ${done?'ready':''}"><div class="gift-box">${done?'🎁':'🗺️'}</div><div>${done?`<div class="gb-t">보물 지도 끝까지 왔어요!</div><div class="gb-gift">${esc(s.settings.mapGift||'보물 선물')}</div><div class="gb-s">엄마 아빠에게 보여주세요 💕</div>`:`<div class="gb-t">배지·스티커판으로 한 칸씩! 앞으로 <b style="color:var(--pink-d)">${N-steps}칸</b></div><div class="gb-gift">도착하면 🎁 ${esc(s.settings.mapGift||'보물 선물')}</div><div class="gb-s">받은 배지가 순서대로 지도에 붙어요</div>`}</div></div>
 <div class="map" style="height:${rows*130+30}px"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${path}" class="road"/>${dp?`<path d="${dp}" class="road done"/>`:''}</svg>${nodes}</div>
 <h3 class="sec">🎯 보물 지도 앞으로 가는 방법</h3>
 <div class="how"><div><b>🏅</b>배지 받기<small>과목 퀘스트·별·연속 출석</small></div><div><b>🏆</b>스티커판 채우기<small>${s.settings.stickerGoal||10}칸을 채울 때마다</small></div><div><b>💌</b>부모님 칭찬<small>약속을 잘 지켰을 때</small></div><div><b>📺</b>TV 쿠폰은 따로!<small>퀘스트 1개 = 쿠폰 1장</small></div></div>
 <h3 class="sec">🏅 배지 모음</h3>

function openOverlay(html){const o=$('#overlay');o.innerHTML=html;o.classList.add('on');}
function closeOverlay(){const o=$('#overlay');o.classList.remove('on');o.innerHTML='';if(confettiRAF)cancelAnimationFrame(confettiRAF);}
let confettiRAF=null;
function confetti(){const cv=$('#confetti');if(!cv)return;const W=cv.width=cv.offsetWidth,H=cv.height=cv.offsetHeight;const c=cv.getContext('2d');const cols=['#FF7EA8','#FFD54F','#5CC96B','#5BC0EB','#9C7CF4','#FF9F43'];const ps=Array.from({length:120},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:5+Math.random()*6,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[rint(cols.length)]}));const t0=performance.now();
 const f=t=>{c.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.c;c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);c.restore();});if(t-t0<4000)confettiRAF=requestAnimationFrame(f);else c.clearRect(0,0,W,H);};confettiRAF=requestAnimationFrame(f);}
function showCelebrate({title,lines,bug}){openOverlay(`<div class="ov-bg"><canvas id="confetti"></canvas><div class="modal">
 <div class="mchar float">${PPU_SVG}</div><h2>${title}</h2>
 ${bug!=null?`<div class="newbug"><div class="sart">${cArt(bug)}</div></div><div class="rw">🐞 새 도감 친구 <b style="color:var(--pink-d)">${esc(cName(bug))}</b>!</div><div class="hint">스티커판에 붙였어요</div>`:''}
 ${lines.map(l=>`<div class="rw">${l}</div>`).join('')}
 <div class="btns"><button class="btn big green" onclick="closeOverlay();App.go('home')">좋아요! 🙌</button></div></div></div>`);confetti();}
function confirmBox(text,onYes,yesLabel='응, 할래',danger=false){openOverlay(`<div class="ov-bg"><div class="modal"><div class="mchar">${PPU_SVG}</div><div class="rw" style="font-size:26px">${text}</div><div class="btns"><button class="btn gray" onclick="closeOverlay()">아니</button><button class="btn ${danger?'red':'green'}" id="cy">${yesLabel}</button></div></div></div>`);$('#cy').onclick=()=>{closeOverlay();onYes();};}
let PIN={v:'',cb:null};
function askPin(title,cb){PIN={v:'',cb};openOverlay(`<div class="ov-bg"><div class="modal" id="pinm" style="max-width:380px"><div style="font-size:30px">🔒 ${title}</div><div class="hint">숫자 4자리를 눌러주세요</div><div class="pin-dots" id="pd">${'<i></i>'.repeat(4)}</div>
 <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join('')}<button onclick="closeOverlay()" style="font-size:22px">취소</button><button onclick="pinKey('0')">0</button><button onclick="pinKey('del')">⌫</button></div></div></div>`);}
function pinKey(k){SFX.tap();if(k==='del')PIN.v=PIN.v.slice(0,-1);else if(PIN.v.length<4)PIN.v+=k;[...$('#pd').children].forEach((d,i)=>d.classList.toggle('on',i<PIN.v.length));
 if(PIN.v.length===4){if(hash('pin:'+PIN.v)===S().setup.pinHash){const cb=PIN.cb;setTimeout(()=>{closeOverlay();cb&&cb();},150);}else{SFX.no();const m=$('#pinm');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');setTimeout(()=>{PIN.v='';[...$('#pd').children].forEach(d=>d.classList.remove('on'));},350);}}}

  <label class="lb">새 아이디 (비워두면 그대로)<input class="inp" id="a_id" autocapitalize="off" autocomplete="off"></label>
  <label class="lb">새 비밀번호 (비워두면 그대로)<input class="inp" id="a_pw" type="password" autocomplete="new-password"></label>
  <label class="lb">새 부모님 비밀번호 4자리 (비워두면 그대로)<input class="inp" id="a_pin" type="password" inputmode="numeric" maxlength="4"></label>
  <div class="err" id="a_err"></div><button class="btn green" onclick="saveAccount()">변경 저장</button></div>
  <div class="pcard"><h4>💾 저장 위치</h4><div class="hint">${Store.mode==='cloud'?'☁️ Claude 계정에 저장되고 있어요. 같은 Claude 계정으로 로그인한 다른 기기에서도 이어서 할 수 있어요.':'📱 이 태블릿(브라우저)에 저장되고 있어요. 브라우저 데이터를 지우면 기록이 사라질 수 있으니, 가끔 학습 기록 탭에서 기록 코드를 복사해 Claude에게 보내 두세요.'}${Store.syncErr?'<br>⚠️ 최근 저장에 실패했어요. 인터넷 연결을 확인해 주세요.':''}</div>
  <div class="hint">아이디·비밀번호는 아이용 간단 잠금이에요. 중요한 비밀번호는 쓰지 마세요.</div></div>`;}
 return `<div class="screen"><header class="subbar"><button class="icon-btn" onclick="leaveParent()">⬅️<small>나가기</small></button><h2>🔒 부모님 메뉴</h2></header>
 <div class="ptabs">${tabs.filter(t=>App.parentFrom!=='login'||t[0]==='account').map(t=>`<button class="ptab ${tab===t[0]?'on':''}" onclick="App.ptab='${t[0]}';App.go('parent')">${t[1]}</button>`).join('')}</div>${body}</div>`;}
function weeklyReport(){const s=S();const wk=weekDays();const per={};let qd=0,full=0,att=0;
 wk.forEach(k=>{const d=s.days[k];if(!d)return;if(d.quests.some(q=>q.done))att++;if(d.allDone)full++;d.quests.forEach(q=>{if(q.done){qd++;per[q.type]=(per[q.type]||0)+1;}});});
 const acc=Object.entries(s.stats||{}).filter(([t,o])=>TYPES[t]&&o.r+o.w>=5).map(([t,o])=>({t,p:Math.round(o.r/(o.r+o.w)*100),n:o.r+o.w})).sort((a,b)=>b.p-a.p);
 const best=acc[0],weak=acc.length>1?acc[acc.length-1]:null;
 const comment=att===0?'이번 주는 아직 탐험 기록이 없어요. 오늘 함께 시작해 보세요!':full>=5?'이번 주 정말 꾸준했어요! 많이 칭찬해 주세요 👏':full>=3?'잘하고 있어요. 이틀만 더 하면 연속 배지에 가까워져요.':'조금씩 시작했어요. 정해진 시간에 같이 앉아 주면 습관이 잡혀요.';
 return `<div class="pcard"><h4>📈 이번 주 학습 리포트</h4><div class="kv"><div>출석<b>${att} / 7일</b></div><div>하루 완료<b>${full}일</b></div><div>끝낸 퀘스트<b>${qd}개</b></div><div>보물 지도<b>${mapProg()} / ${s.settings.mapLen||40}칸</b></div></div>
  <div class="hint">과목별: ${Object.keys(per).length?Object.entries(per).map(([t,n])=>`${TYPES[t]?TYPES[t].name:t} ${n}`).join(' · '):'아직 없어요'}</div>
  ${acc.length?`<div class="hint">정답률: ${acc.map(a=>`${TYPES[a.t].name} ${a.p}%`).join(' · ')}</div>`:''}
  ${best?`<div class="prow"><span style="font-size:19px">💪 잘하는 과목: <b>${TYPES[best.t].name}</b>${weak&&weak.p<best.p?` &nbsp; 🌱 더 연습하면 좋은 과목: <b>${TYPES[weak.t].name}</b>`:''}</span></div>`:''}
  <div style="font-size:19px;color:var(--pink-d)">💬 ${comment}</div></div>`;}
function leaveParent(){PS=null;if(App.parentFrom==='login'||!App.loggedIn)App.go('login');else App.go('home');}
function psStep(d){PS.questCount=Math.max(1,Math.min(7,PS.questCount+d));$('#qc').textContent=PS.questCount;SFX.tap();}
function psSub(t,el){PS.subjects[t]=!PS.subjects[t];if(!TYPE_ORDER.some(x=>PS.subjects[x])){PS.subjects[t]=true;toast('과목은 1개 이상 골라주세요');return;}el.classList.toggle('on',PS.subjects[t]);SFX.tap();}
function psSet(k,v,el){PS[k]=v;el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');SFX.tap();}
function saveSettings(){const s=S();PS.mapGift=($('#p_mgift').value.trim()||'보물 선물');const nm=$('#p_name').value.trim();if(nm)s.setup.childName=nm;s.settings=JSON.parse(JSON.stringify(PS));
 const rw=rebuildToday();checkBadges();
 Store.save();SFX.ok();toast(rw?'저장했어요! 오늘 퀘스트 완료로 스티커를 받았어요':'저장했어요! 오늘 퀘스트에 바로 적용됐어요');
 }
function mapGiftGiven(){confirmBox('보물 지도 선물을 주셨나요?<br>새 지도를 시작할게요',()=>{const s=S();s.maps=(s.maps||0)+1;s.mapOffset=(s.mapOffset||0)+(s.settings.mapLen||40);Store.save();SFX.win();toast('새 보물 지도 시작! 🗺️');App.go('parent');},'네, 줬어요');}
function giftGiven(){confirmBox('선물을 주셨나요?<br>새 스티커판을 시작할게요',()=>{const s=S();const g=s.settings.stickerGoal;s.stickers.current=s.stickers.current.slice(g);s.stickers.boards++;s.giftReady=s.stickers.current.length>=g;checkBadges();Store.save();SFX.win();toast('새 스티커판 시작! 🐞');App.go('parent');},'네, 줬어요');}
function markCoupon(id){const c=S().coupons.find(x=>x.id===id);if(c){c.used=true;c.usedAt=todayKey();Store.save();toast('사용 처리했어요');}App.go('parent');}
function bonus(kind){const s=S();if(kind==='map'){s.mapBonus=(s.mapBonus||[]).concat([{d:todayKey()}]);checkBadges();Store.save();SFX.ok();toast('지도 1칸 앞으로! 🗺️');App.go('parent');return;}if(kind==='star'){s.stars++;toast('별 1개를 줬어요 ⭐');}else if(kind==='sticker'){const b=addSticker();toast(`스티커 1개를 줬어요 (${cName(b)})`);}else{s.coupons.unshift({id:'c'+Date.now(),min:s.settings.tvMinutes||10,date:todayKey(),used:false});toast('TV 쿠폰 1장을 줬어요 📺');}checkBadges();Store.save();SFX.ok();App.go('parent');}
function resetProgress(){confirmBox('정말 모든 학습 기록과<br>보상을 지울까요?',()=>{const s=S();const keep={setup:s.setup,settings:s.settings};const n=defaultState();n.setup=keep.setup;n.settings=keep.settings;Store.state=n;Store.save();toast('초기화했어요');App.go('parent');},'지우기',true);}
function saveAccount(){const s=S();const id=$('#a_id').value.trim().toLowerCase(),pw=$('#a_pw').value,pin=$('#a_pin').value.trim();const e=$('#a_err');
 if(!id&&!pw&&!pin){e.textContent='바꿀 내용을 입력해 주세요';return;}if(pw&&pw.length<4){e.textContent='비밀번호는 4자 이상으로 해주세요';return;}if(pin&&!/^\d{4}$/.test(pin)){e.textContent='부모님 비밀번호는 숫자 4자리예요';return;}
 if(id)s.setup.childId=id;if(pw)s.setup.pwHash=hash(pw);if(pin)s.setup.pinHash=hash('pin:'+pin);lsDel('bugquest_auto');Store.save();SFX.ok();toast('계정 정보를 바꿨어요');App.go('parent');}

/* ---------- 시작 ---------- */
(async function boot(){renderBG();
 $('#app').innerHTML=`<div class="screen center loading"><div class="crawl">${bugSVG(0)}</div><p>탐험 준비 중...</p></div>`;
 try{window.speechSynthesis&&window.speechSynthesis.getVoices();}catch(e){}
 await Store.init();
 await loadConfig();testBadge();
 const s=S();
 if(!s.setup){App.go('setup');return;}
 applyAdmin();
 const auto=lsGet('bugquest_auto');if(auto&&auto===hash('auto:'+s.setup.childId+s.setup.pwHash)){App.loggedIn=true;App.go('home');}else App.go('login');
 let lastDay=todayKey();setInterval(()=>{if(todayKey()!==lastDay){lastDay=todayKey();if(App.screen==='home')App.go('home');}},60000);
 window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(App.screen==='quest'&&Q&&(isTrace(Q.q.type)||Q.q.type==='draw')&&PAD&&PAD.strokes===0)App.go('quest');},400);});
})();
</script>
</body>
</html>
